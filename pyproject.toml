[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adbons"
version = "0.5.0"
description = "A wrapper for the Android adb tool. It's just adb on steroids"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["android", "debug", "bridge", "adb"]
license = { text = "BSD" }
authors = [ { name = "Daniel Bälz", email = "me@dbaelz.de" } ]
dependencies = ["click>=8.5.0", "pyyaml>=6.0"]
urls = { Homepage = "https://github.com/dbaelz/adbons" }

classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Utilities",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
]


[project.scripts]
adbons = "src.adbons:cli"

[tool.setuptools.packages.find]
where = ["."]


